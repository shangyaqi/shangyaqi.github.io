baseURL: https://shangyaqi.github.io/
languageCode: zh-cn
defaultContentLanguage: zh
title: Yaqi's Tech Blog
theme: PaperMod
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

languages:
  zh:
    languageName: "中文"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
    menu:
      main:
        - name: 归档
          url: archives/
          weight: 5
        - name: 分类
          url: categories/
          weight: 10
        - name: 标签
          url: tags/
          weight: 15
        - name: 搜索
          url: search/
          weight: 20
        - name: 关于
          url: about/
          weight: 25
  en:
    languageName: "English"
    weight: 2
    taxonomies:
      category: categories
      tag: tags
    menu:
      main:
        - name: Archive
          url: archives/
          weight: 5
        - name: Categories
          url: categories/
          weight: 10
        - name: Tags
          url: tags/
          weight: 15
        - name: Search
          url: search/
          weight: 20
        - name: About
          url: about/
          weight: 25

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "AI · DevOps · Quant — 探索技术的边界"
  author: Yaqi Shang
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hi there 👋"
    Content: >
      SRE / AI 工程师 / 量化交易爱好者。

      这里记录我在 **AI**、**DevOps** 和**量化交易**领域的探索与实践。

  socialIcons:
    - name: github
      url: "https://github.com/shangyaqi"
    - name: telegram
      url: "https://t.me/yaqi_shang"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/shangyaqi/shangyaqi.github.io/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true

  assets:
    disableHLJS: true

  cover:
    linkFullImages: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai
